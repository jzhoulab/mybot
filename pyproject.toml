[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memory-chatbot"
version = "0.1.0"
description = "Lightweight shared-memory chatbot with Discord transport and manual trajectory sync."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.7.0",
  "sentence-transformers>=5.1.0",
]
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["app*", "client*", "sources*"]
