# Slack app for one person's mybot. api.slack.com/apps -> Create New App ->
# From a manifest -> pick the workspace -> paste this (YAML), replacing
# HANDLE with the owner's handle so teammates can tell whose bot is whose.
display_information:
  name: HANDLE-mybot
  description: HANDLE's mybot — answers about their projects and research
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: HANDLE-mybot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - users:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
